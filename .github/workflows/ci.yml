name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Demo run
        run: python examples/demo.py
      - name: CLI smoke / gate check
        run: |
          glyphscrub --version
          glyphscrub scan examples/clean-note.txt --fail-on low
          ! glyphscrub scan examples/defanged-samples/tag-charset-note.txt --fail-on high