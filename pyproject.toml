[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glyphscrub"
version = "0.1.0"
description = "Detect and remove steganographic and encoded prompt-injection channels from untrusted text."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["llm-security", "prompt-injection", "unicode", "sanitizer", "red-team-defense"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.scripts]
glyphscrub = "glyphscrub.cli:entry"

[tool.setuptools.packages.find]
where = ["src"]